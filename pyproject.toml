[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papertrace"
dynamic = ["version"]
description = "Trace a published paper's claims back to what its cited sources actually say — then scout the literature that came after. Citation-backed claims checked against the cited pages with page-level visual evidence; citation labels no claim reached are reported deterministically."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PaperTrace contributors" }]
keywords = ["fact-checking", "citations", "research-integrity", "literature-review", "peer-review", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pymupdf>=1.24",
    # NOT an extra any more. Cited sources are judged on their own text, and the
    # evidence for a subgroup claim is usually a table row — read flat, the row
    # is gone. Spending layout fidelity on the paper but not on the papers it is
    # judged against had the asymmetry backwards, so the layout backend is part
    # of the tool rather than an upgrade to it. Pulls torch; the ~500 MB layout
    # models download on first *use*, not on install, so CI installs this and
    # never runs it (every test pins backend="pymupdf").
    "docling>=2.0",
    "pillow>=10.0",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
png = ["playwright>=1.45"]
# `papertrace mcp`, for MCP hosts. The server is written against the SDK's 2.x
# API, and the SDK holds breaking changes for a major, hence the bound
mcp = ["mcp>=2.2,<3"]
# kept as a no-op alias so `pip install papertrace[docling]` and the `[full]`
# extra named all over the 0.4.x docs keep resolving instead of erroring
docling = []
full = ["playwright>=1.45", "mcp>=2.2,<3"]
dev = ["pytest>=8.0", "ruff>=0.5", "jsonschema>=4.0",
       # 3.10 has no tomllib, and without a parser the whole packaging
       # suite skipped on the oldest version requires-python allows
       'tomli>=2.0; python_version < "3.11"',
       # so CI runs tests/test_mcp_server.py instead of skipping it
       "mcp>=2.2,<3"]

[project.scripts]
papertrace = "papertrace.cli:main"

[project.urls]
Homepage = "https://github.com/defraction0/PaperTrace"
Issues = "https://github.com/defraction0/PaperTrace/issues"
Changelog = "https://github.com/defraction0/PaperTrace/blob/main/CHANGELOG.md"
Releases = "https://github.com/defraction0/PaperTrace/releases"

# single source of truth for the version — pyproject reads __init__.py,
# so the two can no longer drift apart
[tool.hatch.version]
path = "src/papertrace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrace"]

[tool.hatch.build.targets.sdist]
# Hatchling include/exclude patterns are gitignore-style, so a bare "README.md"
# matches at ANY depth. That is why v0.3.1's sdist carried evals/README.md and
# examples/demo/README.md and nothing else from either tree — the packaged
# evals README documented a runner the archive did not contain. Root-level
# files are anchored with "/"; directories are named explicitly.
#
# evals/tests ships on purpose: testpaths below names it, and an archive whose
# config points at a directory it does not carry makes bare pytest fail on
# collection. A harness without the tests that prove its arithmetic is an
# unverifiable harness.
include = [
    "/src",
    "/prompts",
    "/schemas",
    "/evals",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CLAUDE.md",
    "/CITATION.cff",
]
# The explicit guard — do not rely on hatchling honouring VCS ignores. The
# entries below that sit outside every include root (case, demo_case, dist,
# .serena, .claude) cannot ship regardless and are guards, not fixes; they
# hold if an include is ever widened.
exclude = [
    "evals/runs/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "**/.DS_Store",
    "/.serena/**",
    "/.claude/settings.local.json",
    "/case/**",
    "/demo_case/**",
    "/dist/**",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/papertrace/cli.py" = ["B008"]  # typer's option-in-default idiom

[tool.pytest.ini_options]
testpaths = ["tests", "evals/tests"]
