<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 32" width="336" height="64" fill="none">
  <!-- Derived in this repo from papertrace-mark-dark.svg and the wordmark of
       papertrace-logo-light.svg: the bare mark the hand-off assigns to dark
       surfaces, with the wordmark in paper. The light lockup's ink wordmark is
       unreadable on a dark page. Same 168x32 frame as the light lockup, so the
       two swap without a size change. -->
  <g transform="translate(4 4)">
    <rect x="3" y="5" width="7" height="2" rx="1" fill="#f4f1ea"/>
    <rect x="3" y="9.5" width="5" height="2" rx="1" fill="#8b949e"/>
    <rect x="3" y="14" width="4" height="2" rx="1" fill="#8b949e"/>
    <circle cx="11.5" cy="6" r="1.4" fill="#e5484d"/>
    <path d="M11.5 6 H14.5 Q16 6 16 7.5 V10.5 Q16 12 17.5 12 H19" stroke="#e5484d" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="11" y="12" width="10" height="7" rx="1.2" stroke="#e5484d" stroke-width="1.6"/>
    <rect x="13" y="14.7" width="6" height="1.6" rx=".8" fill="#f4f1ea"/>
  </g>
  <text x="42" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="-0.2" fill="#f4f1ea">PaperTrace</text>
</svg>
